<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DID:nostr Explorer</title>
  <meta name="description" content="Explore Nostr DIDs - view profiles, follows, and relays">
  <meta property="og:title" content="DID:nostr Explorer">
  <meta property="og:description" content="Explore Nostr DIDs - view profiles, follows, and relays">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    // Default provider and example
    const DEFAULT_PROVIDER = 'https://nostr.rocks';
    const EXAMPLE_PUBKEY = '32e1827635450ebb3c5a7d12c1f8e7b2b514439ac10a67eef3d9fd9c5c68e245';
    const RELAYS = [
      'wss://relay.damus.io',
      'wss://nos.lol',
      'wss://purplepag.es',
      'wss://relay.primal.net',
      'wss://relay.snort.social',
      'wss://nostr.wine',
      'wss://nostr.mom',
      'wss://relay.nostr.net'
    ];

    // Utility: format pubkey for display
    function formatPubkey(pk, len = 16) {
      if (!pk || pk.length < len) return pk;
      return pk.slice(0, len/2) + '...' + pk.slice(-len/2);
    }

    // Utility: validate hex pubkey
    function isValidPubkey(pk) {
      return /^[0-9a-f]{64}$/.test(pk);
    }

    // Utility: parse DID or pubkey input
    function parseDid(input) {
      const trimmed = input.trim().toLowerCase();
      if (trimmed.startsWith('did:nostr:')) {
        return trimmed.slice(10);
      }
      return trimmed;
    }

    // Utility: get/set URL query param
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function setQueryParam(name, value) {
      const url = new URL(window.location);
      url.searchParams.set(name, value);
      window.history.pushState({}, '', url);
    }

    // Fetch DID document from provider
    async function fetchDidDocument(provider, pubkey) {
      const url = `${provider}/.well-known/did/nostr/${pubkey}.json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Failed to fetch: ${res.status}`);
      return res.json();
    }

    // Fast relays for bulk profile fetching (fewer connections)
    const FAST_RELAYS = [
      'wss://purplepag.es',
      'wss://relay.nostr.band',
      'wss://relay.damus.io'
    ];

    // Fetch profile from Nostr relays (kind 0)
    async function fetchProfile(pubkey, fast = false) {
      const relays = fast ? FAST_RELAYS : RELAYS;
      // Try relays in parallel
      const results = await Promise.all(
        relays.map(relay => fetchFromRelay(relay, pubkey, 0))
      );

      // Return first valid profile found
      for (const event of results) {
        if (event?.content) {
          try {
            return JSON.parse(event.content);
          } catch {}
        }
      }
      return null;
    }

    // Fetch from a single relay
    function fetchFromRelay(relay, pubkey, kind) {
      return new Promise((resolve) => {
        let resolved = false;
        const subId = Math.random().toString(36).slice(2);

        const timer = setTimeout(() => {
          if (!resolved) {
            console.log(`[${relay}] kind ${kind}: timeout`);
            resolved = true;
            try { ws.close(); } catch {}
            resolve(null);
          }
        }, 8000);

        let ws;
        try {
          ws = new WebSocket(relay);
        } catch (e) {
          console.log(`[${relay}] kind ${kind}: connection error`, e);
          clearTimeout(timer);
          resolve(null);
          return;
        }

        ws.onopen = () => {
          console.log(`[${relay}] kind ${kind}: connected, sending REQ`);
          try {
            ws.send(JSON.stringify(['REQ', subId, { kinds: [kind], authors: [pubkey], limit: 1 }]));
          } catch (e) {
            console.log(`[${relay}] kind ${kind}: send error`, e);
            clearTimeout(timer);
            resolved = true;
            resolve(null);
          }
        };

        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            console.log(`[${relay}] kind ${kind}: received`, msg[0], msg[2]?.kind);
            if (msg[0] === 'EVENT' && msg[2]?.kind === kind) {
              if (!resolved) {
                console.log(`[${relay}] kind ${kind}: got event!`);
                resolved = true;
                clearTimeout(timer);
                ws.close();
                resolve(msg[2]);
              }
            }
            if (msg[0] === 'EOSE' && !resolved) {
              console.log(`[${relay}] kind ${kind}: EOSE (no data)`);
              resolved = true;
              clearTimeout(timer);
              ws.close();
              resolve(null);
            }
          } catch (e) {
            console.log(`[${relay}] kind ${kind}: parse error`, e);
          }
        };

        ws.onerror = (e) => {
          console.log(`[${relay}] kind ${kind}: ws error`, e);
          if (!resolved) {
            resolved = true;
            clearTimeout(timer);
            resolve(null);
          }
        };

        ws.onclose = () => {
          if (!resolved) {
            console.log(`[${relay}] kind ${kind}: closed before resolve`);
            resolved = true;
            clearTimeout(timer);
            resolve(null);
          }
        };
      });
    }

    // Fetch follows from Nostr relays (kind 3)
    async function fetchFollows(pubkey) {
      // Try all relays in parallel
      const results = await Promise.all(
        RELAYS.map(relay => fetchFromRelay(relay, pubkey, 3))
      );

      // Find the best result (most follows)
      let bestFollows = [];
      for (const event of results) {
        if (event?.tags) {
          const follows = event.tags.filter(t => t[0] === 'p').map(t => t[1]);
          if (follows.length > bestFollows.length) {
            bestFollows = follows;
          }
        }
      }

      console.log('Follows results from relays:', results.filter(r => r).length, 'responded');
      return bestFollows;
    }

    // Profile Card Component
    function ProfileCard({ profile, pubkey }) {
      if (!profile) return null;

      return html`
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-4 sm:p-6 mb-4 sm:mb-6">
          <div class="flex items-start gap-3 sm:gap-4">
            ${profile.picture ? html`
              <img
                src=${profile.picture}
                alt="Avatar"
                class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover shrink-0"
                onError=${(e) => e.target.style.display = 'none'}
              />
            ` : html`
              <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 shrink-0"></div>
            `}
            <div class="flex-1 min-w-0 overflow-hidden">
              <h2 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white truncate">
                ${profile.display_name || profile.name || 'Anonymous'}
              </h2>
              ${profile.nip05 ? html`
                <p class="text-purple-600 dark:text-purple-400 text-sm">${profile.nip05}</p>
              ` : null}
              ${profile.about ? html`
                <p class="text-gray-600 dark:text-gray-300 mt-2 text-sm whitespace-pre-wrap">${profile.about}</p>
              ` : null}
              ${profile.website ? html`
                <a href=${profile.website} target="_blank" rel="noopener" class="text-blue-500 hover:underline text-sm mt-2 block">
                  ${profile.website}
                </a>
              ` : null}
              <a
                href=${`https://nostr.rocks/users/${pubkey}`}
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1 mt-2 px-3 py-1 text-xs sm:text-sm bg-purple-100 dark:bg-purple-900 text-purple-700 dark:text-purple-300 rounded-full hover:bg-purple-200 dark:hover:bg-purple-800 transition-colors"
              >
                Open in Nostr →
              </a>
            </div>
          </div>
        </div>
      `;
    }

    // DID Document Component
    function DidDocument({ did, provider }) {
      const [expanded, setExpanded] = useState(false);

      // Extract pubkey from did:nostr:<pubkey>
      const pubkey = did.id?.replace('did:nostr:', '') || '';
      const jsonUrl = `${provider}/.well-known/did/nostr/${pubkey}.json`;

      return html`
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-4 sm:p-6 mb-4 sm:mb-6">
          <div class="flex justify-between items-center mb-3 sm:mb-4">
            <h3 class="text-base sm:text-lg font-semibold text-gray-900 dark:text-white">DID Document</h3>
            <button
              onClick=${() => setExpanded(!expanded)}
              class="text-sm text-purple-600 hover:text-purple-800 dark:text-purple-400"
            >
              ${expanded ? 'Collapse' : 'Expand'}
            </button>
          </div>
          ${expanded ? html`
            <pre class="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg overflow-x-auto text-xs">
              ${JSON.stringify(did, null, 2)}
            </pre>
          ` : html`
            <div class="text-sm text-gray-600 dark:text-gray-400 overflow-hidden">
              <a
                href=${jsonUrl}
                target="_blank"
                rel="noopener noreferrer"
                class="break-all font-mono text-purple-600 dark:text-purple-400 text-xs sm:text-sm hover:underline"
              >${did.id}</a>
            </div>
          `}
        </div>
      `;
    }

    // Single Follow Item Component (fetches its own profile)
    function FollowItem({ pubkey, onSelect }) {
      const [profile, setProfile] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        let cancelled = false;
        fetchProfile(pubkey, true).then(p => {
          if (!cancelled) {
            setProfile(p);
            setLoading(false);
          }
        }).catch(() => {
          if (!cancelled) setLoading(false);
        });
        return () => { cancelled = true; };
      }, [pubkey]);

      return html`
        <button
          onClick=${() => onSelect(pubkey)}
          class="flex items-center gap-2 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors overflow-hidden w-full text-left"
        >
          ${loading ? html`
            <div class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-600 animate-pulse shrink-0"></div>
          ` : profile?.picture ? html`
            <img
              src=${profile.picture}
              alt=""
              class="w-8 h-8 rounded-full object-cover shrink-0"
              onError=${(e) => e.target.style.display = 'none'}
            />
          ` : html`
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 shrink-0"></div>
          `}
          <div class="flex-1 min-w-0">
            <div class="text-sm text-gray-900 dark:text-white truncate">
              ${profile?.display_name || profile?.name || formatPubkey(pubkey, 16)}
            </div>
            ${(profile?.display_name || profile?.name) ? html`
              <div class="text-xs text-gray-500 dark:text-gray-400 font-mono truncate">
                ${formatPubkey(pubkey, 16)}
              </div>
            ` : null}
          </div>
        </button>
      `;
    }

    // Follows List Component
    function FollowsList({ follows, onSelect, loading }) {
      const [page, setPage] = useState(0);
      const perPage = 10;
      const totalPages = Math.ceil(follows.length / perPage);
      const displayed = follows.slice(page * perPage, (page + 1) * perPage);

      if (loading) {
        return html`
          <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-4 sm:p-6">
            <h3 class="text-base sm:text-lg font-semibold text-gray-900 dark:text-white mb-4">Following</h3>
            <p class="text-gray-500 dark:text-gray-400 text-sm">Loading follows...</p>
          </div>
        `;
      }

      if (follows.length === 0) {
        return html`
          <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-4 sm:p-6">
            <h3 class="text-base sm:text-lg font-semibold text-gray-900 dark:text-white mb-4">Following</h3>
            <p class="text-gray-500 dark:text-gray-400 text-sm">No follows found</p>
          </div>
        `;
      }

      return html`
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-4 sm:p-6">
          <div class="flex justify-between items-center mb-3 sm:mb-4 gap-2">
            <h3 class="text-base sm:text-lg font-semibold text-gray-900 dark:text-white shrink-0">
              Following <span class="text-gray-500 font-normal">(${follows.length})</span>
            </h3>
            ${totalPages > 1 ? html`
              <div class="flex gap-1 sm:gap-2 items-center text-xs sm:text-sm shrink-0">
                <button
                  onClick=${() => setPage(p => Math.max(0, p - 1))}
                  disabled=${page === 0}
                  class="px-1.5 sm:px-2 py-1 rounded bg-gray-200 dark:bg-gray-700 disabled:opacity-50"
                >
                  ←
                </button>
                <span class="text-gray-600 dark:text-gray-400 min-w-[3rem] text-center">${page + 1}/${totalPages}</span>
                <button
                  onClick=${() => setPage(p => Math.min(totalPages - 1, p + 1))}
                  disabled=${page >= totalPages - 1}
                  class="px-1.5 sm:px-2 py-1 rounded bg-gray-200 dark:bg-gray-700 disabled:opacity-50"
                >
                  →
                </button>
              </div>
            ` : null}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-1">
            ${displayed.map(pk => html`
              <${FollowItem} key=${pk} pubkey=${pk} onSelect=${onSelect} />
            `)}
          </div>
        </div>
      `;
    }

    // Loading Spinner
    function Spinner() {
      return html`
        <div class="flex justify-center py-8">
          <div class="w-8 h-8 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
      `;
    }

    // Main App Component
    function App() {
      const [provider, setProvider] = useState(DEFAULT_PROVIDER);
      const [input, setInput] = useState('');
      const [pubkey, setPubkey] = useState('');
      const [didDoc, setDidDoc] = useState(null);
      const [profile, setProfile] = useState(null);
      const [follows, setFollows] = useState([]);
      const [loading, setLoading] = useState(false);
      const [loadingFollows, setLoadingFollows] = useState(false);
      const [error, setError] = useState('');

      // Check URL query param on load
      useEffect(() => {
        const pk = getQueryParam('pubkey');
        if (pk) {
          const parsed = parseDid(pk);
          if (isValidPubkey(parsed)) {
            setInput(pk);
            loadDid(parsed);
          }
        }
      }, []);

      async function loadDid(pk) {
        if (!isValidPubkey(pk)) {
          setError('Invalid pubkey format. Expected 64 hex characters.');
          return;
        }

        setLoading(true);
        setLoadingFollows(true);
        setError('');
        setPubkey(pk);
        setDidDoc(null);
        setProfile(null);
        setFollows([]);

        // Update URL query param
        setQueryParam('pubkey', pk);

        try {
          // Fetch DID document
          const doc = await fetchDidDocument(provider, pk);
          setDidDoc(doc);
        } catch (e) {
          console.error('DID fetch error:', e);
          // Continue anyway - we can still show relay data
        }

        try {
          // Fetch profile first
          const profileData = await fetchProfile(pk);
          setProfile(profileData);
          setLoading(false);

          // Then fetch follows (can take longer)
          const followsData = await fetchFollows(pk);
          console.log('Follows fetched:', followsData.length);
          setFollows(followsData);
          setLoadingFollows(false);
        } catch (e) {
          console.error('Relay fetch error:', e);
          setLoading(false);
          setLoadingFollows(false);
        }
      }

      function handleSubmit(e) {
        e.preventDefault();
        const pk = parseDid(input);
        loadDid(pk);
      }

      function handleExample() {
        setInput(EXAMPLE_PUBKEY);
        loadDid(EXAMPLE_PUBKEY);
      }

      return html`
        <div class="min-h-screen bg-gray-100 dark:bg-gray-900">
          <!-- Header -->
          <header class="bg-white dark:bg-gray-800 shadow-sm">
            <div class="max-w-4xl mx-auto px-4 py-4 sm:py-6">
              <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">
                DID:nostr Explorer
              </h1>
              <p class="text-gray-600 dark:text-gray-400 mt-1 text-sm sm:text-base">
                Explore Nostr decentralized identities
              </p>
            </div>
          </header>

          <!-- Main Content -->
          <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 sm:py-8">
            <!-- Search Form -->
            <form onSubmit=${handleSubmit} class="mb-4 sm:mb-8">
              <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
                <div class="flex-1">
                  <input
                    type="text"
                    value=${input}
                    onInput=${(e) => setInput(e.target.value)}
                    placeholder="Enter pubkey or DID"
                    class="w-full px-3 py-2.5 sm:py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent text-xs sm:text-base font-mono overflow-hidden text-ellipsis"
                  />
                </div>
                <button
                  type="submit"
                  class="px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg transition-colors"
                >
                  Explore
                </button>
              </div>
              <div class="mt-2 flex flex-wrap gap-2 sm:gap-4 text-xs sm:text-sm">
                <button
                  type="button"
                  onClick=${handleExample}
                  class="text-purple-600 hover:text-purple-800 dark:text-purple-400"
                >
                  Try jb55
                </button>
                <div class="flex items-center gap-1 sm:gap-2 text-gray-600 dark:text-gray-400">
                  <label>Provider:</label>
                  <input
                    type="text"
                    value=${provider}
                    onInput=${(e) => setProvider(e.target.value)}
                    class="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-xs sm:text-sm w-32 sm:w-auto"
                  />
                </div>
              </div>
            </form>

            <!-- Error Message -->
            ${error ? html`
              <div class="bg-red-100 dark:bg-red-900 border border-red-400 text-red-700 dark:text-red-300 px-4 py-3 rounded-lg mb-6">
                ${error}
              </div>
            ` : null}

            <!-- Loading -->
            ${loading ? html`<${Spinner} />` : null}

            <!-- Results -->
            ${!loading && pubkey ? html`
              <div class="space-y-6">
                <!-- Profile -->
                <${ProfileCard} profile=${profile} pubkey=${pubkey} />

                <!-- DID Document -->
                ${didDoc ? html`<${DidDocument} did=${didDoc} provider=${provider} />` : null}

                <!-- Follows -->
                <${FollowsList}
                  follows=${follows}
                  loading=${loadingFollows}
                  onSelect=${(pk) => {
                    setInput(pk);
                    loadDid(pk);
                  }}
                />
              </div>
            ` : null}

            <!-- Empty State -->
            ${!loading && !pubkey ? html`
              <div class="text-center py-12">
                <div class="text-6xl mb-4">🔍</div>
                <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-300 mb-2">
                  Enter a DID or pubkey to explore
                </h2>
                <p class="text-gray-500 dark:text-gray-400">
                  View profiles, follows, and DID documents from the Nostr network
                </p>
              </div>
            ` : null}
          </main>

          <!-- Footer -->
          <footer class="max-w-4xl mx-auto px-4 py-8 text-center text-gray-500 dark:text-gray-400 text-sm">
            <p>
              Powered by <a href="https://nostr.rocks" class="text-purple-600 hover:underline">nostr.rocks</a> |
              <a href="https://nostrcg.github.io/did-nostr/" class="text-purple-600 hover:underline">DID:nostr spec</a> |
              <a href="https://github.com/nostrapps/did-explorer" class="text-purple-600 hover:underline">Source</a>
            </p>
          </footer>
        </div>
      `;
    }

    // Render the app
    render(html`<${App} />`, document.getElementById('app'));
  </script>
</head>
<body class="dark:bg-gray-900">
  <div id="app"></div>
</body>
</html>
